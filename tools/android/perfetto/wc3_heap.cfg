# Perfetto heapprofd capture for native allocations in the WC3 debug build.
#
# heapprofd requires Android 10+ and an app with android:debuggable or
# android:profileable.  tools/android/profile_app.ps1 resolves the process,
# expands the pid and duration placeholders, then feeds the result to perfetto
# over stdin.
buffers {
  size_kb: 65536
  fill_policy: RING_BUFFER
}

data_sources {
  config {
    name: "android.heapprofd"
    target_buffer: 0
    heapprofd_config {
      sampling_interval_bytes: 4096
      shmem_size_bytes: 16777216
      # Do not stall the game when the shared buffer fills; lower the sample
      # rate instead.  The heap trace is for relative growth, not allocation
      # accounting.
      adaptive_sampling_shmem_threshold: 8388608
      adaptive_sampling_max_sampling_interval_bytes: 65536
      # profile_app.ps1 has already resolved the debug process, so an explicit
      # pid avoids a package-name mismatch on vendor Android builds.
      pid: __WC3_PID__
      continuous_dump_config {
        dump_interval_ms: 5000
      }
    }
  }
}

duration_ms: __WC3_DURATION_MS__
write_into_file: true
file_write_period_ms: 1000
max_file_size_bytes: 134217728
