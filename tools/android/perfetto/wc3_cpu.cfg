# Perfetto system trace for the WC3 debug build.
#
# tools/android/profile_app.ps1 expands __WC3_PACKAGE__ and
# __WC3_DURATION_MS__, sends the result to perfetto over stdin and pulls the
# trace.  Open the pulled .perfetto-trace in https://ui.perfetto.dev or
# trace_processor.
buffers {
  size_kb: 65536
  fill_policy: RING_BUFFER
}

data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_wakeup_new"
      ftrace_events: "sched/sched_process_exit"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"

      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "wm"
      atrace_categories: "am"
      atrace_categories: "input"
      atrace_apps: "__WC3_PACKAGE__"

      buffer_size_kb: 16384
      drain_period_ms: 250
    }
  }
}

data_sources {
  config {
    name: "linux.process_stats"
    target_buffer: 0
    process_stats_config {
      scan_all_processes_on_start: true
      proc_stats_poll_ms: 1000
      record_thread_names: true
    }
  }
}

duration_ms: __WC3_DURATION_MS__
write_into_file: true
file_write_period_ms: 1000
max_file_size_bytes: 134217728
